services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: findit
      POSTGRES_PASSWORD: findit
      POSTGRES_DB: findit
    ports:
      - "5432:5432"
    volumes:
      - findit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findit -d findit"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - findit_minio:/data

volumes:
  findit_pg:
  findit_minio:
